name: Build Windows EXE

on:
  workflow_dispatch: # 允许在 Actions 页面手动点击按钮触发构建

jobs:
  build:
    runs-on: windows-latest # 使用 GitHub 提供的 Windows 最新版运行器
    permissions:
      contents: read # 仅需读取仓库内容的权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # 安装稳定版 Rust 工具链
        with:
          targets: x86_64-pc-windows-msvc # 明确指定 Windows MSVC 目标

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release EXE
        run: cargo build --release

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-rust-app-windows-x64 # 下载时看到的 artifact 名称
          path: target/release/*.exe # 上传所有生成的 exe 文件
          retention-days: 5 # artifact 保留 5 天，可按需修改
